name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:   # GitHub's merge queue (issue 573): the queue builds a merge group and needs CI ok on it
  schedule:
    - cron: '17 3 * * *'   # nightly, at real timing (CI_FAST off), so the real pacing is still exercised
  workflow_dispatch:
    inputs:
      real_timing:
        description: Run the timer-bound checks at real timing (CI_FAST off)
        type: boolean
        default: false

# CI_FAST=1 (scripts/ci-clock.mjs, issue #543) scales the real-time waits inside the check scripts about tenfold.
# The nightly run and a manual run with real_timing leave it off.
env:
  CI_FAST: ${{ (github.event_name == 'schedule' || inputs.real_timing) && '0' || '1' }}

# A new push to a PR cancels its older run. Every PR runs CI, so the required "CI ok" check (branch
# protection on main) always reports and GitHub's auto-merge (gh pr merge --auto) can act.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# hash-guard (issue 573) runs on pull requests only: it posts the seeded-hash table and fails when a hash moved against
# main unless the PR carries the label hash-change-ok (a scripted-world change the owner or PR author vouches for).
# Parallel groups: a run takes as long as its slowest group, not the sum. "CI ok" is the one check the
# auto-merge workflow (automerge.yml) waits for. Add a new check as a step in a group; a new job must also
# be listed in ok.needs.
jobs:
  core:
    name: Build, world, saves, sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - name: Fetch origin/main for the append-only table check
        run: git fetch --depth=1 origin +main:refs/remotes/origin/main
      - {name: Static build, run: npm run build}
      - name: Repo rules (layering and name literals and append-only tables and CI coverage and patch notes)
        run: npm run rulescheck
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ github.token }}
      - {name: World spec snapshot check, run: npm run worldcheck}
      - {name: Passability layer check, run: npm run passablecheck}
      - {name: Paths check, run: npm run pathcheck}
      - {name: Ways in words, run: npm run waycheck}
      - {name: Save/load round trip, run: npm run savecheck}
      - {name: init() reset, run: npm run initcheck}
      - {name: Downed and death saves, run: npm run downcheck}
      - {name: Hero will (bequeath), run: npm run bequeathcheck}
      - {name: Fellowship archetypes, run: npm run archetypecheck}
      - {name: Agent-built personality, run: npm run personacheck}
      - {name: Pack and inventory, run: npm run invcheck}
      - {name: Bestiary, run: npm run bestiarycheck}
      - {name: Class abilities and specialisations, run: npm run movecheck}
      - {name: Score growth chosen by agent heroes, run: npm run scorecheck}
      - name: Headless sim (10 game-hours)
        run: npm run sim -- 10 | tee sim.txt
      - name: Sanity-check the sim summary
        run: |
          grep -q "Living heroes:" sim.txt
          test "$(grep -o 'Living heroes: [0-9]*' sim.txt | grep -o '[0-9]*$')" -gt 0
      - uses: actions/upload-artifact@v4
        with: {name: sim-summary, path: sim.txt}

  world:
    name: World levers, gathering, setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - {name: DM levers, run: npm run levercheck}
      - {name: Guild focus (neutral setting and Fellowship exempt), run: npm run focuscheck}
      - {name: Gathering, run: npm run gathercheck}
      - {name: Road traffic, run: npm run trafficcheck}
      - {name: Crafting, run: npm run craftcheck}
      - {name: Hero trades, run: npm run tradecheck}
      - {name: Gathering nodes, run: npm run nodecheck}
      - {name: Recipes, run: npm run recipecheck}
      - {name: Professions, run: npm run professioncheck}
      - {name: Art pipeline (mock Hugging Face and assets on and off), run: npm run artcheck}
      - {name: New World setup, run: npm run setupcheck}

  ui:
    name: Watcher UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - {name: Watcher UI keeps scroll and open rows (stubbed DOM), run: npm run uismoke}
      - {name: New World setup and title screen (stubbed DOM), run: npm run setupsmoke}

  agents:
    name: Agent players and runners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - {name: Agent player (mock agents), run: npm run playcheck}
      - {name: Townsfolk hails, run: npm run localscheck}
      - {name: Sightings and couriers (issue 446), run: npm run sightcheck}
      - {name: Table scene waits (slow mock members), run: npm run scenewaitcheck}
      - {name: Hero standing orders, run: npm run orderscheck}
      - {name: OpenAI provider (mock OpenAI and no key), run: npm run openaicheck}
      - {name: Hugging Face provider (mock router and no token), run: npm run hfcheck}
      - {name: Gemini provider (mock Gemini and no key), run: npm run googlecheck}
      - {name: App runners and relay concurrency (mock Ollama and 429), run: npm run runnercheck}
      - {name: Session size (real CLI on a mock API), run: npm run sessioncheck}
      - {name: Runner labels stay steady (issue 563), run: npm run labelcheck}
      - {name: Behavior logs (mock runners), run: npm run behaviorcheck}
      - {name: Cost report (fixture logs), run: npm run costcheck}

  rate:
    name: Model request rate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - {name: Model request rate (counting mock relay), run: npm run ratecheck}

  dm:
    name: DM agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - {name: DM agent (mock agent and Ollama), run: npm run dmcheck}

  local:
    name: Local agent runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - {name: Local agent runner (mock Ollama), run: npm run localcheck}

  launcher:
    name: One-window launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - {name: One-window launcher and runner resume, run: npm run upcheck}

  minds-a:
    name: Table, crawl, camp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - {name: Dungeon crawl room by room, run: npm run crawlcheck}
      - {name: DM-made dungeon sites, run: npm run sitecheck}
      - {name: Camp and rest, run: npm run campcheck}
      - {name: Town autopilot and danger edges, run: npm run townpilotcheck}
      - {name: Gambits (agent heroes' own rules), run: npm run gambitcheck}
      - {name: Quest log (several quests per hero; scripted world unchanged), run: npm run questcheck}

  minds-b:
    name: Brain, channels, memory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - {name: Brain policy and relay (mock model), run: npm run braincheck}
      - {name: Table mode and staged scenes, run: npm run tablecheck}
      - {name: Companies (the verbs; the apart world end to end), run: npm run companycheck}
      - {name: Talk guard (introductions and repeats; refused talk counted), run: npm run talkcheck}
      - {name: Companies initiate the Crypt and raids, run: npm run initiatecheck}
      - {name: In-game channels (planted secrets never reach a hero), run: npm run channelcheck}
      - {name: DM rumours and names for deeds (seed_rumour and bestow), run: npm run rumourcheck}
      - {name: Semantic memory search (mock Ollama embeddings), run: npm run embedcheck}
      - {name: Campaign seed parser and seeding, run: npm run campaigncheck}
      - {name: Learn the world, run: npm run lorecheck}
      - {name: Tool quick wins, run: npm run toolwincheck}
      - {name: Pay and mark tools, run: npm run paymarkcheck}
      - {name: Wish tool for the builders (DM and heroes), run: npm run wishcheck}
      - {name: Hire tool, run: npm run hirecheck}
      - {name: Companion voice (scripted companions voiced by the DM), run: npm run compvoicecheck}
      - {name: Challenge tool (honour duels at the table), run: npm run challengecheck}
      - {name: Free actions ruled by the DM (issue 522), run: npm run attemptcheck}
      - {name: DM voices long-poll and answer in time (issue 680), run: npm run voicecheck}
      - {name: More turn triggers, run: npm run wakecheck}
      - {name: Action log, run: npm run actcheck}
      - {name: Tiered memory, run: npm run tiercheck}

  hash-guard:
    name: Seeded hashes against main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - name: Fetch origin/main
        run: git fetch --depth=1 origin +main:refs/remotes/origin/main
      - name: Compare the seeded hashes with main
        id: hashes
        run: |
          set +e
          node scripts/hashcheck.mjs --against origin/main --md hashes.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Quote the patch note above the hash table (issue 664)
        run: |
          node scripts/patchnotes.mjs --quote "${{ github.event.pull_request.number }}" > comment.md
          cat hashes.md >> comment.md 2>/dev/null || true
      - name: Comment the patch note and hash table
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pr-comment.mjs "${{ github.event.pull_request.number }}" eldmoor-hash-guard comment.md
      - name: Fail when a hash moved without the label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="${{ steps.hashes.outputs.code }}"
          if [ "$code" = 0 ]; then echo "all hashes equal main"; exit 0; fi
          if [ "$code" = 1 ]; then echo "a hash probe failed to run"; exit 1; fi
          labels="$(gh pr view "${{ github.event.pull_request.number }}" --json labels --jq '.labels[].name')"
          if echo "$labels" | grep -qx hash-change-ok; then echo "hash moved and the PR has hash-change-ok"; exit 0; fi
          echo "A seeded hash moved against main. If the change is meant to move the scripted world, add the label hash-change-ok and re-run this job."
          exit 1

  ok:
    name: CI ok
    if: always()
    needs: [core, world, ui, agents, local, launcher, rate, dm, minds-a, minds-b, hash-guard]
    runs-on: ubuntu-latest
    steps:
      - name: Every group passed
        run: |
          test "${{ needs.core.result }}" = success
          test "${{ needs.world.result }}" = success
          test "${{ needs.ui.result }}" = success
          test "${{ needs.agents.result }}" = success
          test "${{ needs.local.result }}" = success
          test "${{ needs.launcher.result }}" = success
          test "${{ needs.rate.result }}" = success
          test "${{ needs.dm.result }}" = success
          test "${{ needs.minds-a.result }}" = success
          test "${{ needs.minds-b.result }}" = success
          # hash-guard only runs on pull requests (skipped on pushes and merge groups)
          case "${{ needs.hash-guard.result }}" in success|skipped) ;; *) exit 1 ;; esac
