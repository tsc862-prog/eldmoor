name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Build and headless sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Static build
        run: npm run build
      - name: World spec snapshot check
        run: npm run worldcheck
      - name: Watcher UI keeps scroll and open rows while the world ticks (stubbed DOM)
        run: npm run uismoke
      - name: Save/load round trip
        run: npm run savecheck
      - name: Model request rate (counting mock relay)
        run: npm run ratecheck
      - name: Brain policy and relay (mock model)
        run: npm run braincheck
      - name: Local agent runner (mock Ollama)
        run: npm run localcheck
      - name: OpenAI provider (mock OpenAI, no key)
        run: npm run openaicheck
      - name: App runners and relay concurrency (mock Ollama, mock 429)
        run: npm run runnercheck
      - name: DM agent (mock agent, mock Ollama)
        run: npm run dmcheck
      - name: In-game channels (planted secrets never reach a hero)
        run: npm run channelcheck
      - name: Behavior logs (mock runners, known anomalies logged and reported)
        run: npm run behaviorcheck
      - name: Headless sim (10 game-hours)
        run: npm run sim -- 10 | tee sim.txt
      - name: Sanity-check the sim summary
        run: |
          grep -q "Living heroes:" sim.txt
          # the world must still have heroes alive after the run
          test "$(grep -o 'Living heroes: [0-9]*' sim.txt | grep -o '[0-9]*$')" -gt 0
      - uses: actions/upload-artifact@v4
        with:
          name: sim-summary
          path: sim.txt
